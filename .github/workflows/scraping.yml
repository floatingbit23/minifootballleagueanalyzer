name: Scraping Nocturno

on:
  schedule:
    - cron: '0 2 * * 3' # Se ejecuta a las 2:00 AM UTC cada miércoles
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necesario para solicitar credenciales temporales vía OIDC
      contents: read  # Solo necesitamos leer el código para ejecutarlo

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Acelera la instalación de dependencias

    - name: Instalar Google Chrome
      run: |
        # Añade la clave de firma de Google para poder descargar el paquete oficial
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        
        # Añade el repositorio de Chrome a la lista de fuentes del gestor de paquetes apt
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        # Actualiza el índice de paquetes del sistema
        sudo apt-get update
        
        # Instala la versión estable de Chrome necesaria para que Selenium funcione en modo headless
        sudo apt-get install -y google-chrome-stable

    - name: Instalar dependencias de Python
      run: |
        # Instala todas las librerías necesarias especificadas en requirements.txt
        pip install -r requirements.txt

    - name: Ejecutar Scraping
      run: |
        # Inicia el proceso de extracción de datos de la web original
        python backend/league_scraping.py
        
    - name: Sincronizar Logos y Avatares (Local)
      run: |
        # Descarga las imágenes externas y las convierte en archivos locales con nombres MD5
        python backend/sync_logos.py

    - name: Ejecutar Análisis ELO
      run: |
        # Procesa los resultados obtenidos para calcular rankings ELO y generar archivos para el frontend
        python backend/simulacion_final.py

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Subir archivos a AWS S3
      run: |
        # Sincronizar rankings ELO finales y estadísticas
        aws s3 cp frontend/public/elo_rankings.json s3://${{ secrets.AWS_S3_BUCKET }}/elo_rankings.json --cache-control "max-age=31536000"
        aws s3 sync frontend/public/stats/ s3://${{ secrets.AWS_S3_BUCKET }}/stats/ --cache-control "max-age=31536000"
        # Sincronizar imágenes descargadas de equipos y jugadores
        aws s3 sync frontend/public/images/ s3://${{ secrets.AWS_S3_BUCKET }}/images/ --cache-control "max-age=31536000"

    - name: Invalidar caché de CloudFront
      run: |
        # Crear invalidación para refrescar el contenido en la CDN
        aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
