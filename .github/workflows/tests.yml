name: Integration & E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias de Python
      run: |
        pip install -r requirements.txt

    - name: Ejecutar Pytest
      run: |
        pytest -v

  frontend-tests:
    name: Frontend Tests (Vitest & Playwright E2E)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar dependencias del Frontend
      run: |
        cd frontend
        npm ci

    - name: Ejecutar Vitest (Unitarios e Integración)
      run: |
        cd frontend
        npx vitest run

    - name: Instalar Navegadores de Playwright
      run: |
        cd frontend
        npx playwright install --with-deps

    - name: Ejecutar Playwright E2E
      run: |
        cd frontend
        npx playwright test

    - name: Subir Reporte de Playwright (en caso de fallo)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
